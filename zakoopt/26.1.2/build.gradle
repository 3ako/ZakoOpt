plugins {
	id 'net.fabricmc.fabric-loom'
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	implementation "maven.modrinth:sodium:${sodium_version}"
	implementation "maven.modrinth:immediatelyfast:${immediatelyfast_version}"
	compileOnly "maven.modrinth:iris:${iris_version}"
	compileOnly "maven.modrinth:modmenu:${modmenu_version}"
	localRuntime "maven.modrinth:modmenu:${modmenu_version}"
}

loom {
	runs {
		client {
			// -Pworld=<save> joins a singleplayer world, -Pbench=<dir> enables zakobench's command loop
			if (project.hasProperty('world')) {
				programArgs "--quickPlaySingleplayer", project.world
			}
			if (project.hasProperty('jvm')) {
				vmArgs project.jvm.split(' ')
			}
			if (project.hasProperty('bench')) {
				vmArgs "-Dzakobench.dir=${project.bench}", "-Dzakobench.hidechat=true"
			}
		}
	}
}
